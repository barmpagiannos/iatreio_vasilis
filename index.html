<!doctype html>
<html lang="el">
  <head>

    <title>Μπαρμπαγιάννος Βασίλης</title>
    <link rel="stylesheet" href="styles.css" />

  <body>
    <main class="home-page">
      <header class="site-header">
        <h1>Μπαρμπαγιάννος Βασίλης</h1>

      <section class="welcome" aria-labelledby="welcome-title">
        <p class="eyebrow">Ιατρείο</p>
        <h2 id="welcome-title">Καλώς ήρθατε</h2>
        <p>Για να κλείσετε το ραντεβού σας, πατήστε το παρακάτω κουμπί.</p>
        <button class="appointment-button" type="button" aria-controls="appointment-widget">
          Κλείστε ραντεβού
        </button>

        <div class="appointment-widget" id="appointment-widget">
          <iframe
            src="https://medical-appointment-booking-widget.ai.studio/?embed=true&amp;doctor=QoNrbIhSs09WpEolYyaF"
            width="100%"
            height="720"
            frameborder="0"
            style="border: none; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.08);"
            title="Κράτηση Ραντεβού"
            loading="lazy"
          ></iframe>
        </div>
      </section>
    </main>
    <script src="script.js"></script>
  </body>
